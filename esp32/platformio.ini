; PlatformIO project: totalizer / hour meter firmware.
; Build + flash:   pio run -e esp32dev -t upload
; Unit tests (PC): pio test -e native
; Static analysis: pio check -e esp32dev

[platformio]
name = totalizer-hour-meter
default_envs = esp32dev

; Settings shared by every environment.
[env]
lib_deps =
  symlink://../sensorframe/arduino
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Iinclude
; Strict warnings apply to OUR code only: src/ (below) and lib/* (library.json "build.flags").
build_src_flags =
  -Wall
  -Wextra
  -Werror
check_tool = clangtidy
check_flags =
  clangtidy: --checks=-*,bugprone-*,cert-*,clang-analyzer-*,performance-*,readability-braces-around-statements,-bugprone-easily-swappable-parameters,-cert-err58-cpp,-bugprone-reserved-identifier,-cert-dcl37-c,-cert-dcl51-cpp
check_src_filters = +<src/> +<lib/> -<lib/*/test/>

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600 
monitor_speed = 115200
; Product firmware: everything in src/ except the bench tester.
build_src_filter = +<*> -<bench/>
; Bluetooth Classic is ~800 KB: use the 3 MB app partition (no OTA in this firmware).
board_build.partitions = huge_app.csv

[env:bench]
; Module bench-test firmware (docs/TESTING-MODULES.md):
;   pio run -e bench -t upload && pio device monitor -e bench
platform = espressif32 
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
build_src_filter = -<*> +<bench/>

[env:native]
; Host-side unit tests with fake I2C devices (no hardware needed).
platform = native
test_framework = unity
test_build_src = no
build_flags =
  ${env.build_flags}
  -Itest/fakes
  -fsanitize=address,undefined
  -fno-omit-frame-pointer
  -lm
lib_compat_mode = off
