; PlatformIO project: totalizer / hour meter firmware.
; Build + flash:   pio run -e esp32dev -t upload     (the devboard: ESP32 DevKit with plug-in modules)
;                  pio run -e can-board -t upload    (the main board)
; Unit tests (PC): pio test -e native
; Static analysis: pio check -e esp32dev

[platformio]
name = totalizer-hour-meter
default_envs = esp32dev

; Settings shared by every environment.
[env]
lib_deps =
  symlink://../sensorframe/arduino
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Iinclude
; Strict warnings apply to OUR code only: src/ (below) and lib/* (library.json "build.flags").
build_src_flags =
  -Wall
  -Wextra
  -Werror
check_tool = clangtidy
check_flags =
  clangtidy: --checks=-*,bugprone-*,cert-*,clang-analyzer-*,performance-*,readability-braces-around-statements,-bugprone-easily-swappable-parameters,-cert-err58-cpp,-bugprone-reserved-identifier,-cert-dcl37-c,-cert-dcl51-cpp
check_src_filters = +<src/> +<lib/> -<lib/*/test/>

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
; The board's pins and IMU mounting: include/BoardPins.h (0 = the devboard: ESP32 DevKit with plug-in modules).
build_flags =
  ${env.build_flags}
  -DHM_BOARD=0
; Product firmware: everything in src/ except the bench tester.
build_src_filter = +<*> -<bench/>
; Bluetooth Classic is ~800 KB: the 3 MB app partition of huge_app.csv (no OTA in this firmware),
; plus "hmdata" for the flash copy of the settings and counters (see partitions.csv).
board_build.partitions = partitions.csv

[env:can-board]
; The same firmware for the main board, which has the CAN port
; (schematic/hour-meter-board/): the UART link on its RS232 port,
; the GPS pins left alone, IMU readings turned into the board's axes (include/BoardPins.h).
;   pio run -e can-board -t upload
extends = env:esp32dev
build_flags =
  ${env.build_flags}
  -DHM_BOARD=1

[env:bench]
; Module bench-test firmware (docs/TESTING-MODULES.md):
;   pio run -e bench -t upload && pio device monitor -e bench
platform = espressif32 
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
build_src_filter = -<*> +<bench/>
; One bench build for both boards: it uses only the I2C bus and GPIO26/27, which are the same on both.
build_flags =
  ${env.build_flags}
  -DHM_BOARD=0

[env:native]
; Host-side unit tests with fake I2C devices (no hardware needed).
platform = native
test_framework = unity
test_build_src = no
build_flags =
  ${env.build_flags}
  -Itest/fakes
  -fsanitize=address,undefined
  -fno-omit-frame-pointer
  -lm
lib_compat_mode = off
